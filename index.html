<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- EIDO 아이콘 (29CM 스타일 EI/DO 격자, 2026-10-29) — 원본: Eido/Brand/icon/29cm-style/favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>AGC</title>
    <!-- 테마를 그리기 전에 붙인다 (어두운 테마에서 흰 화면이 번쩍이지 않게) — hooks/useTheme -->
    <script>
      try {
        var t = localStorage.getItem('agc.theme')
        if (t) document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <!-- 넷러너 테마 영문·숫자 글꼴 (한글은 Pretendard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
